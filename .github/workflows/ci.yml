name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Next build / server components may import Prisma.
      # Provide a throwaway SQLite DB path so Prisma can initialize during CI.
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-secret"
      AUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      # Deploy secret metadata placeholders for fail-fast validation (names/shape only).
      TF_STATE_BACKEND: "ci-placeholder"
      CLOUD_PROJECT_ID_STAGING: "ci-staging"
      CLOUD_PROJECT_ID_PROD: "ci-prod"
      CI_DEPLOY_ROLE_ARN: "ci-role"
      APP_DATABASE_URL: "ci-placeholder"
      APP_AUTH_SECRET: "ci-placeholder"
      APP_AUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Validate deploy metadata env (fail-fast)
        run: npm run secrets:validate:ci

      - name: Sanity (local parity)
        run: npm run sanity

      - name: Build
        run: npm run build
